name: Dependency Auto Merge

# Merges a pull request once it is approved and every check is green. The
# approval comes from the maintainer, or from the daily dep-triage run acting on
# their behalf within the limits in .agent/skills/dep-triage/SKILL.md.
#
# This workflow makes no decisions of its own: scripts/dep-triage-report.py
# decides and this job executes the result, so the policy stays reviewable in one
# place.
#
# Renovate's own automerge is disabled, because it merges on "CI green" alone.
# An approval is the part that makes a merge deliberate.

on:
  # The usual path: approve, and the merge follows within the minute.
  pull_request_review:
    types: [submitted]
  # Covers approving a PR whose checks are still running. No further review event
  # fires when they finish, so without this the PR would wait for the next push.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Declaring any permission sets every scope not listed here to none, so this
  # has to be explicit: the evaluate step reads its own run to resolve
  # check_suite_id, and without it that call 403s and the job fails outright.
  actions: read

concurrency:
  group: dep-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge PRs that pass the gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always evaluate against the workflow's own branch, never a PR's version
      # of the script: a PR must not be able to rewrite the policy that admits it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Decide what may be merged
        id: evaluate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # This job's own check run lands on the head commit of the pull request
          # under review and is still in progress right here, so the evaluator has
          # to skip it. Otherwise the gate waits for itself and merges nothing —
          # which is exactly what it did, silently, until 2026-08-28.
          SELF_CHECK_SUITE_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq .check_suite_id)
          export SELF_CHECK_SUITE_ID
          echo "skipping checks in suite ${SELF_CHECK_SUITE_ID}"
          python3 scripts/dep-triage-report.py --json vspo-lab/vspo-portal > /tmp/decisions.json
          python3 scripts/dep-triage-report.py vspo-lab/vspo-portal

      - name: Merge what the evaluator cleared
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          COUNT=$(python3 -c "import json;print(sum(1 for d in json.load(open('/tmp/decisions.json')) if d['decision']=='MERGE'))")
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing is approved and green. This is a normal outcome."
            exit 0
          fi

          python3 -c "
          import json
          for d in json.load(open('/tmp/decisions.json')):
              if d['decision'] == 'MERGE':
                  print('%s\t%s\t%s' % (d['repo'], d['number'], d['why']))
          " > /tmp/to-merge.tsv

          while IFS=$'\t' read -r repo number why; do
            echo "::group::Merging ${repo}#${number}"
            echo "reason: ${why}"
            # Squash to match the repository's history style. A merge that GitHub
            # refuses (branch protection, a race with a new push) fails loudly
            # rather than being retried blindly.
            if gh api -X PUT "repos/${repo}/pulls/${number}/merge" \
                 -f merge_method=squash \
                 -f commit_title="$(gh pr view "${number}" --repo "${repo}" --json title --jq .title) (#${number})" \
                 -f commit_message="Merged by dep-auto-merge. ${why}"; then
              echo "merged"
            else
              echo "::warning::Could not merge ${repo}#${number}; leaving it open"
            fi
            echo "::endgroup::"
          done < /tmp/to-merge.tsv
