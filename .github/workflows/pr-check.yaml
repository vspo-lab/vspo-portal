name: PR Check

on:
  pull_request:
    paths:
      - 'service/vspo-schedule/v2/web/**'
      - 'service/bot-dashboard/**'
      - 'packages/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pr-check.yaml'
      # Root manifests: without these, a lockfile-only dependency PR would run no
      # checks at all and "every check green" would be vacuously true.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      bot-dashboard: ${{ steps.filter.outputs.bot-dashboard }}
      packages: ${{ steps.filter.outputs.packages }}
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            web:
              - 'service/vspo-schedule/v2/web/**'
            bot-dashboard:
              - 'service/bot-dashboard/**'
            packages:
              - 'packages/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - '.github/**/*.md'
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # A dependency update can change runtime behaviour anywhere, so it must
            # pull in the build and test jobs even when no service path changed.
            deps:
              - 'package.json'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  biome-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
      - name: Biome Check
        run: pnpm biome:check

  typescript-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
      - name: TypeScript Check
        run: pnpm tsc

  knip-check:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
      - name: Knip Check
        run: pnpm knip

  textlint-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
        with:
          build: 'false'
      - name: Textlint Check
        run: pnpm textlint

  markdownlint-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
        with:
          build: 'false'
      - name: Markdownlint Check
        run: pnpm markdownlint

  cspell-check:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
        with:
          build: 'false'
      - name: Spell Check
        run: pnpm cspell

  bundle-size:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
      - name: Build web app
        run: pnpm --filter vspo-schedule-v2-web exec next build
        env:
          NEXT_PUBLIC_SITE_URL: "https://www.vspo-portal.com"
      - name: Analyze bundle
        run: cd service/vspo-schedule/v2/web && npx -p nextjs-bundle-analysis report
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: service/vspo-schedule/v2/web/.next/analyze/__bundle_analysis.json

  test:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs['bot-dashboard'] == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      web-result: ${{ steps.web-test.outcome }}
      web-summary: ${{ steps.web-test.outputs.summary }}
      bot-result: ${{ steps.bot-test.outcome }}
      bot-summary: ${{ steps.bot-test.outputs.summary }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
        with:
          build: 'false'
      - name: Build package dependencies
        run: pnpm --filter "@vspo-lab/*" build

      - name: Test web (schedule)
        id: web-test
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.deps == 'true'
        env:
          NO_COLOR: 1
        run: |
          cd service/vspo-schedule/v2/web
          pnpm test:coverage 2>&1 | tee /tmp/web-test-output.txt
          echo "summary=$("$GITHUB_WORKSPACE/scripts/coverage-summary-row.sh" /tmp/web-test-output.txt coverage/coverage-summary.json)" >> "$GITHUB_OUTPUT"

      - name: Test bot-dashboard
        id: bot-test
        if: needs.changes.outputs['bot-dashboard'] == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.deps == 'true'
        env:
          NO_COLOR: 1
        run: |
          cd service/bot-dashboard
          pnpm test:coverage 2>&1 | tee /tmp/bot-test-output.txt
          echo "summary=$("$GITHUB_WORKSPACE/scripts/coverage-summary-row.sh" /tmp/bot-test-output.txt coverage/coverage-summary.json)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage (web)
        if: always() && steps.web-test.outcome == 'success'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: service/vspo-schedule/v2/web/coverage/coverage-final.json
          flags: web
          fail_ci_if_error: false
      - name: Upload coverage (bot-dashboard)
        if: always() && steps.bot-test.outcome == 'success'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: service/bot-dashboard/coverage/coverage-final.json
          flags: bot-dashboard
          fail_ci_if_error: false

  e2e-bot-dashboard:
    needs: changes
    if: needs.changes.outputs['bot-dashboard'] == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
        with:
          build: 'false'
      - name: Build package dependencies
        run: pnpm --filter "@vspo-lab/*" build
      - name: Install Playwright browser
        run: pnpm --filter bot-dashboard exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm --filter bot-dashboard test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-bot-dashboard
          path: service/bot-dashboard/playwright-report
          retention-days: 7

  e2e-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
        with:
          build: 'false'
      - name: Build package dependencies
        run: pnpm --filter "@vspo-lab/*" build
      - name: Install Playwright browser
        run: pnpm --filter vspo-schedule-v2-web exec playwright install --with-deps chromium
      - name: Run Playwright
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm --filter vspo-schedule-v2-web test:e2e
      - name: Show page snapshots of failed tests
        if: failure()
        run: find service/vspo-schedule/v2/web/test-results -name error-context.md -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \;
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web
          path: service/vspo-schedule/v2/web/playwright-report
          retention-days: 7

  # Post a summary comment on the PR with all check results
  pr-summary:
    needs: [changes, biome-check, typescript-check, knip-check, textlint-check, markdownlint-check, cspell-check, bundle-size, test, e2e-bot-dashboard, e2e-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build summary comment
        id: summary
        env:
          BIOME: ${{ needs.biome-check.result }}
          TSC: ${{ needs.typescript-check.result }}
          KNIP: ${{ needs.knip-check.result }}
          TEXTLINT: ${{ needs.textlint-check.result }}
          MARKDOWNLINT: ${{ needs.markdownlint-check.result }}
          CSPELL: ${{ needs.cspell-check.result }}
          BUNDLE: ${{ needs.bundle-size.result }}
          TEST: ${{ needs.test.result }}
          E2E_BOT: ${{ needs.e2e-bot-dashboard.result }}
          E2E_WEB: ${{ needs.e2e-web.result }}
          WEB_SUMMARY: ${{ needs.test.outputs.web-summary }}
          BOT_SUMMARY: ${{ needs.test.outputs.bot-summary }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              skipped) echo "⏭️";;
              cancelled) echo "🚫";;
              *) echo "⬜";;
            esac
          }

          {
            echo "## PR Check Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Biome (lint + format) | $(icon "$BIOME") ${BIOME} |"
            echo "| TypeScript | $(icon "$TSC") ${TSC} |"
            echo "| Knip (unused code) | $(icon "$KNIP") ${KNIP} |"
            echo "| Textlint | $(icon "$TEXTLINT") ${TEXTLINT} |"
            echo "| Markdownlint | $(icon "$MARKDOWNLINT") ${MARKDOWNLINT} |"
            echo "| CSpell | $(icon "$CSPELL") ${CSPELL} |"
            echo "| Bundle Size | $(icon "$BUNDLE") ${BUNDLE} |"
            echo "| Tests | $(icon "$TEST") ${TEST} |"
            echo "| E2E (bot-dashboard) | $(icon "$E2E_BOT") ${E2E_BOT} |"
            echo "| E2E (web) | $(icon "$E2E_WEB") ${E2E_WEB} |"
            echo ""

            if [ -n "$WEB_SUMMARY" ] || [ -n "$BOT_SUMMARY" ]; then
              echo "### Tests and coverage (whole \`src/\` of each service)"
              echo ""
              echo "| Service | Tests | Statements | Branches | Functions | Lines |"
              echo "|---------|-------|------------|----------|-----------|-------|"
              if [ -n "$WEB_SUMMARY" ]; then
                echo "| Schedule (web) | ${WEB_SUMMARY} |"
              fi
              if [ -n "$BOT_SUMMARY" ]; then
                echo "| Bot Dashboard | ${BOT_SUMMARY} |"
              fi
              echo ""
            fi
          } > /tmp/pr-comment.md

          cat /tmp/pr-comment.md

          # Set multiline output
          {
            echo "body<<ENDOFCOMMENT"
            cat /tmp/pr-comment.md
            echo "ENDOFCOMMENT"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'PR Check Summary'

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.summary.outputs.body }}
          edit-mode: replace
