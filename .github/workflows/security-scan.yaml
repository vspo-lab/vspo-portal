name: Security Scan

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1' # Monday 00:00 UTC
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

# Serialized per ref, but never cancelled: these jobs publish security results.
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  # Blocking scan. Trivy excludes development dependencies by default, and
  # pnpm-lock.yaml v9 carries the Dev field needed to classify them, so this job
  # reports only what is reachable in the production bundle.
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          exit-code: '1'

  # Report only. Build-time and test-time CVEs stay visible without blocking a
  # merge, which is the largest source of red-CI noise on dependency PRs.
  trivy-dev:
    name: Trivy Vulnerability Scan (dev deps, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy (including dev dependencies)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore.yaml'
          exit-code: '0'
          scanners: 'vuln'
        env:
          # trivy-action has no passthrough input for --include-dev-deps, so the
          # flag is set through its environment variable equivalent.
          TRIVY_INCLUDE_DEV_DEPS: 'true'

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source=. --config=.gitleaks.toml --verbose
