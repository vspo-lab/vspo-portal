name: Autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Auto-fix lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on same-repo PRs (not forks), and never on Renovate branches: a
    # third-party commit makes Renovate stop rebasing its own branch. Lint
    # failures on dependency PRs are repaired by the dep-triage routine instead.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'renovate/')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm
        with:
          build: 'false'

      - name: Run Biome fix
        run: |
          pnpm biome check --fix --unsafe
          pnpm biome format --write .

      - name: Auto-commit fixes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "style: auto-fix lint and format"
          commit_options: "--no-verify"
