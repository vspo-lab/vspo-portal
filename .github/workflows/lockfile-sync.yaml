name: Lockfile Sync

# A dependency PR that changes package.json without regenerating pnpm-lock.yaml
# fails at install, and because every job installs first, a one-line bump turns
# six checks red with an error that names none of them. Renovate produced exactly
# that on #1125, and it sat unmergeable for twelve days.
#
# This repairs bot branches automatically and gives a single, legible failure on
# everything else.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: write

concurrency:
  group: lockfile-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Keep pnpm-lock.yaml in step with the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Forks hand out a read-only token, so a push would fail rather than help.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
          run_install: false

      # CI=true makes install frozen by default, which is the condition every
      # other job hits. Judge by exit code, not by matching the error text.
      - name: Check the lockfile against the manifests
        id: check
        env:
          CI: 'true'
        run: |
          if pnpm install --ignore-scripts > /tmp/install.log 2>&1; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile is in step with the manifests."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Frozen install failed:"
            tail -30 /tmp/install.log
          fi

      - name: Regenerate and push
        # Only bot branches are repaired. Pushing to somebody's own branch
        # without asking is a different kind of surprise.
        if: >-
          steps.check.outputs.drift == 'true' &&
          (startsWith(github.head_ref, 'renovate/') || startsWith(github.head_ref, 'dependabot/'))
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile --ignore-scripts

          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::Frozen install failed but regenerating changed nothing."
            echo "The mismatch is not lockfile drift; read the install log above."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): regenerate pnpm-lock.yaml to match the manifests

          The manifest changed without a matching lockfile update, so every job
          that installs dependencies failed before running. Regenerated by
          lockfile-sync."
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "Pushed a regenerated lockfile; CI will re-run."

      - name: Fail with a legible message
        if: >-
          steps.check.outputs.drift == 'true' &&
          !(startsWith(github.head_ref, 'renovate/') || startsWith(github.head_ref, 'dependabot/'))
        run: |
          echo "::error::pnpm-lock.yaml does not match the manifests. Run 'pnpm install' and commit the lockfile."
          tail -30 /tmp/install.log
          exit 1
