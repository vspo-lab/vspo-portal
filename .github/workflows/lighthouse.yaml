name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'service/vspo-schedule/v2/web/**'
      - 'packages/**'

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The most expensive job in the repository, and it already runs with
    # continue-on-error. A dependency bump gains no signal from it.
    if: "!contains(github.event.pull_request.labels.*.name, 'dependencies')"
    steps:
      - uses: actions/checkout@v6

      - name: Setup PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Build web app
        working-directory: service/vspo-schedule/v2/web
        run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3333"

      - name: Run Lighthouse CI
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          workingDir: service/vspo-schedule/v2/web
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
